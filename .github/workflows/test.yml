name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build:demo
      - run: git diff --exit-code -- docs/engine.js docs/stress-lab.html
      - run: node examples/basic.cjs
      - run: npm pack --dry-run
